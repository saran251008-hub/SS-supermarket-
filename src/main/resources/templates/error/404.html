<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Not Found - SS Supermarket')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<section class="section">
    <div class="container">
        <div class="success-card">
            <div class="success-check" style="background:#fef3c7; color:#d97706">&#63;</div>
            <h1 th:text="${error != null ? error : 'Page not found'}">Not found</h1>
            <p class="text-muted mt-1" th:text="${message != null ? message : 'The page or resource you are looking for does not exist.'}">Message</p>
            <div class="flex-between mt-3">
                <a th:href="@{/}" class="btn btn-outline">Go Home</a>
                <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
