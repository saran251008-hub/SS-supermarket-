<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Checkout - SS Supermarket')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<section class="section">
    <div class="container">
        <div class="section-head">
            <h2>Checkout</h2>
            <a th:href="@{/cart}" class="link">&larr; Back to cart</a>
        </div>

        <div th:if="${cart != null and !cart.isEmpty()}" style="display:grid; gap:28px; grid-template-columns: 1fr 340px; align-items:start">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.productName}">Laptop</td>
                        <td th:text="${item.quantity}">1</td>
                        <td>&#8377;<span th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">45000.00</span></td>
                        <td>&#8377;<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}">45000.00</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Items</span>
                    <span th:text="${cart.totalItems}">2</span>
                </div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>&#8377;<span th:text="${#numbers.formatDecimal(cart.totalAmount, 1, 'COMMA', 2, 'POINT')}">50000.00</span></span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span>Free</span>
                </div>
                <div class="summary-row">
                    <span>Total</span>
                    <span>&#8377;<span th:text="${#numbers.formatDecimal(cart.totalAmount, 1, 'COMMA', 2, 'POINT')}">50000.00</span></span>
                </div>

                <p class="text-muted mt-1" style="font-size:0.85rem">
                    This is a demo checkout. No real payment is processed.
                </p>

                <form th:action="@{/checkout/confirm}" method="post" class="mt-2">
                    <button type="submit" class="btn btn-primary btn-block">Confirm Order</button>
                </form>
            </div>
        </div>

        <div th:if="${cart == null or cart.isEmpty()}" class="empty">
            <div class="empty-icon">&#128722;</div>
            <h3>Nothing to check out</h3>
            <p>Your cart is empty.</p>
            <a th:href="@{/products}" class="btn btn-primary">Start Shopping</a>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
