<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Order Success - SS Supermarket')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<section class="section">
    <div class="container">
        <div class="success-card">
            <div class="success-check">&#10004;</div>
            <h1>Order placed successfully!</h1>

            <div class="mt-2">
                <p class="text-muted">Order ID</p>
                <p class="price">#<span th:text="${orderId}">12345</span></p>
            </div>
            <div class="mt-1">
                <p class="text-muted">Total Amount</p>
                <p class="price">&#8377;<span th:text="${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 2, 'POINT')}">45000.00</span></p>
            </div>
            <div class="mt-1" th:if="${order != null}"><p class="text-muted">Payment</p><p th:text="${order.paymentMethod + ' / ' + order.paymentStatus}">COD / PENDING</p><p class="text-muted">Delivery</p><p th:text="${order.shippingFullName + ', ' + order.shippingAddress}">Address</p></div>
            <div class="mt-1">
                <p class="text-muted">Status</p>
                <p><span class="tag" th:text="${orderStatus}">CONFIRMED</span></p>
            </div>

            <div class="flex-between mt-3">
                <a th:href="@{/products}" class="btn btn-outline">Continue Shopping</a>
                <a th:href="@{/orders}" class="btn btn-primary">View Orders</a>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
