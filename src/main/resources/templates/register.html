<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Register - SS Supermarket')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<section class="section">
    <div class="container">
        <form class="form-card" th:action="@{/register}" th:object="${registerRequest}" method="post">
            <h2>Create your account</h2>
            <p class="subtitle">Join SS Supermarket and start shopping today.</p>

            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">Error</div>

            <div class="form-group">
                <label for="name">Full Name(with initial)</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Your full name" required>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="10-digit phone number"
                       pattern="[0-9]{10}" maxlength="10" inputmode="numeric">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                <small class="text-muted">Required for seller accounts.</small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="password" th:field="*{password}" placeholder="Minimum 8 characters" required>
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('password', this)" title="Show/Hide password">&#128065;</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Re-enter your password" required>
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide password">&#128065;</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</div>
            </div>

            <div class="form-group">
                <label for="role">Register as</label>
                <select id="role" th:field="*{role}" required>
                    <option value="">Select a role</option>
                    <option value="BUYER">Buyer</option>
                    <option value="SELLER">Seller</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Role error</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>

            <p class="text-center mt-2 text-muted">Already have an account?
                <a th:href="@{/login}">Login here</a>
            </p>
        </form>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
