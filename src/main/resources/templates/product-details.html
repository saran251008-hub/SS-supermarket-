<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Product Details - SS Supermarket')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<section class="section">
    <div class="container">
        <a th:href="@{/products}" class="text-muted">&larr; Back to products</a>

        <div class="mt-2" style="display:grid; gap:36px; grid-template-columns: 1fr 1fr; align-items:start"
             th:if="${product}">
            <div class="card-media" style="aspect-ratio:auto; min-height:340px; border:1px solid var(--border); border-radius:var(--radius)">
                <img th:src="@{${product.imageUrl != null ? product.imageUrl : '/images/products/default.jpg'}}"
                     th:alt="${product.name}">
            </div>

            <div>
                <span class="tag" th:text="${product.category}">Electronics</span>
                <h1 class="mt-1" th:text="${product.name}">Laptop</h1>
                <p class="text-muted mt-1" th:text="${product.description}">Description</p>

                <p class="price price-lg mt-2">&#8377;<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">45000.00</span></p>

                <div class="seller-panel" th:if="${product.sellerName != null}">
                    <span class="text-muted">Sold by</span>
                    <strong th:text="${product.sellerName}">Seller</strong>
                    <a th:if="${product.sellerPhone != null}" th:href="'tel:' + ${product.sellerPhone}"
                       class="seller-phone" th:aria-label="'Call ' + ${product.sellerName}">
                        <span aria-hidden="true">&#9742;</span>
                        <span th:text="${product.sellerPhone}">9876543210</span>
                    </a>
                </div>

                <p th:if="${product.stock > 0}" class="stock-info mt-1"
                   th:text="'Available stock: ' + ${product.stock}">Available stock</p>
                <p th:if="${product.stock <= 0}" class="stock-info out mt-1">Out of stock</p>

                <form th:if="${product.stock > 0}" class="form-row mt-2" th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                    <div class="form-group">
                        <label for="qtyInput">Quantity</label>
                        <input type="number" id="qtyInput" name="quantity" value="1" min="1"
                               th:max="${product.stock}" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Add to Cart</button>
                    </div>
                </form>

                <div th:if="${product.stock <= 0}" class="mt-2">
                    <button type="button" class="btn btn-primary" disabled>Out of Stock</button>
                </div>

                <div class="mt-3">
                    <a th:href="@{/products(category=${product.category})}" class="link">
                        More in <span th:text="${product.category}">Electronics</span> &rarr;
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
